---
configuration:
  rp_id:
    name: Passkey hostname (optional)
    description: >-
      Leave blank to auto-detect from Home Assistant's own address (Nabu
      Casa or your external_url, if set) — that's right for most people.
      Set this only if you want a separate domain/Cloudflare Tunnel instead,
      e.g. gym.example.com (without https://). See the docs above, Step 2.
  public_url:
    name: Public URL (optional)
    description: >-
      Leave blank to auto-detect from Home Assistant's own address — see
      Passkey hostname above. Only set this (matching that field, with
      https://, e.g. https://gym.example.com) if you're using a separate
      domain/Cloudflare Tunnel.
  rp_name:
    name: Display name
    description: The name shown when someone signs in.
  admin_uids:
    name: Admin user IDs
    description: >-
      Only if you want an admin dashboard — see the docs above,
      "Make yourself an administrator." Leave blank otherwise.
  invite_only:
    name: Require an invite code to sign up
    description: New people need a code from an admin before they can join.
  allow_guest:
    name: Allow Guest mode
    description: Let visitors try the app without creating an account.
  session_days:
    name: Stay signed in for (days)
    description: How many days before someone has to sign in again.
  mcp_enabled:
    name: Enable AI connector
    description: >-
      Optional — lets an AI assistant like Claude or ChatGPT read your
      workouts when you ask it to. See the docs above, Step 4, before
      turning this on.
  mcp_origin:
    name: AI connector address (optional)
    description: >-
      Leave blank to use the Public URL above — that's right for almost
      everyone. Only set a second address here (e.g. https://gym-ai.example.com)
      if you put an access-control layer such as Cloudflare Access in front of
      your Public URL: the AI connector can't complete that kind of login
      redirect, so it needs its own address left out of that layer. See the
      docs above, Step 4.
