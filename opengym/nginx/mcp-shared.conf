# Packaging-only addition, not part of upstream openGym: proxies the MCP
# service's full route surface (mcp/src/http.js — /mcp itself, /manage/*,
# and every path the @modelcontextprotocol/sdk's mcpAuthRouter() registers:
# /token, /register, /revoke, /.well-known/oauth-authorization-server,
# /.well-known/openid-configuration, /.well-known/oauth-protected-resource)
# onto this same web origin.
#
# Why this exists: mcp_origin (see config.yaml) is optional. When it's left
# blank, the mcp/run and api/run s6 services fall back to using public_url
# as MCP_ORIGIN too — i.e. MCP lives on the exact same hostname as the app,
# same port, no second domain/tunnel hostname needed. That only works if
# nginx actually forwards these paths to the mcp backend on this origin,
# which is what this file does. It costs nothing when mcp_enabled is off:
# the mcp service isn't listening on 3001 at all then, so these locations
# just fail to connect instead of ever being reachable.
#
# A real second mcp_origin domain (the other supported mode, e.g. for
# operators who put Cloudflare Access or a similar auth proxy in front of
# the main domain — MCP is machine-to-machine and can't complete that kind
# of interactive login redirect, so it needs to be reachable unauthenticated
# and thus off that domain) talks to the mcp container directly on port
# 3001 and never touches this file.
#
# Spliced directly into default.conf.template right after `set $mcp_backend
# ...;` at build time (see the Dockerfile) — $mcp_backend and the resolver
# are already defined by that point. See the comment there on why a bare
# literal proxy_pass isn't used instead.

    location ^~ /mcp {
        proxy_pass http://$mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # Streamable HTTP transport (SSE-capable): buffering would hold a
        # long-lived response hostage until nginx's buffer fills or the
        # upstream closes, breaking streaming entirely.
        proxy_buffering off;
    }

    location ^~ /manage {
        proxy_pass http://$mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
    }

    location = /health {
        proxy_pass http://$mcp_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /.well-known/oauth-authorization-server {
        proxy_pass http://$mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /.well-known/openid-configuration {
        proxy_pass http://$mcp_backend/.well-known/openid-configuration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://$mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /token {
        proxy_pass http://$mcp_backend/token;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /register {
        proxy_pass http://$mcp_backend/register;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /revoke {
        proxy_pass http://$mcp_backend/revoke;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
