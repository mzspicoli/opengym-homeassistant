---
name: openGym
version: "0.1.3"
slug: opengym
description: >-
  Self-hosted gym & body-weight tracker — routines, workouts, supersets,
  cardio, weight/progress, passkey login. Your data, your server.
url: "https://github.com/mzspicoli/opengym-homeassistant/tree/main/opengym"
image: "ghcr.io/mzspicoli/opengym"
init: false
arch:
  - amd64
  - aarch64
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:dumbbell
ports:
  8099/tcp: 8099
  3001/tcp: null
ports_description:
  8099/tcp: "openGym web (also reachable directly, outside ingress, e.g. behind your own Cloudflare Tunnel)"
  3001/tcp: "MCP endpoint — only needed as its own port/hostname if you set mcp_origin (access-control setups); otherwise MCP shares port 8099 with the web UI and this port can stay unmapped"
map:
  - data:rw
# Lets api/run and mcp/run query Home Assistant Core's own /api/config
# (via the Supervisor's proxy) for external_url, so public_url can default
# to whatever address HA is already reachable at (Nabu Casa Remote UI, or
# your own external_url) instead of requiring one to be typed in by hand.
# Only that one read-only field is used — see the comment in api/run.
homeassistant_api: true
options:
  rp_name: openGym
  invite_only: false
  allow_guest: true
  session_days: 90
  mcp_enabled: false
schema:
  rp_id: str?
  # str? (not url?): the Supervisor's schema-driven Configuration form submits
  # "" for any field left blank rather than omitting the key, and voluptuous's
  # url? does not accept "" as "absent" — it fails the whole save with
  # "expected a URL" even though blank is this option's own documented default
  # (Step 1, guest mode). str? accepts ""; the actual URL shape is validated
  # where it's used (openGym's own runtime, and indirectly by
  # @simplewebauthn's RP config).
  #
  # Renamed from "origin" to "public_url": with the field literally named
  # "origin", real-Supervisor testing showed the Supervisor kept enforcing
  # "expected a URL" on save no matter what schema type this file declared —
  # confirmed unchanged after `ha store reload`, uninstall+reinstall, and a
  # full `ha supervisor restart`, while the identically-shaped mcp_origin
  # field picked up the str? fix immediately from the same edit. The most
  # likely explanation is that "origin" gets special-cased somewhere in the
  # Supervisor's own validation/network layer (a CORS-adjacent reserved name),
  # independent of what this app's schema says. Renaming the option key sits
  # entirely on the app side (the env var, translations label, and Configuration
  # UI still say "Public URL" either way) and sidesteps whatever that
  # special-casing is, rather than fighting an undocumented Supervisor behavior.
  #
  # Also optional as of 0.1.3: leave it blank and api/run + mcp/run default to
  # Home Assistant's own external_url (Nabu Casa Remote UI, or your own
  # domain if you've set one there) — see homeassistant_api above and the
  # comment in api/run. Only set this by hand if you want a dedicated
  # domain/Cloudflare Tunnel instead (still fully supported — see DOCS.md
  # Step 3), or if HA has no external_url configured at all.
  public_url: str?
  rp_name: str
  admin_uids: str?
  invite_only: bool
  allow_guest: bool
  session_days: int(1,365)
  mcp_enabled: bool
  # Optional. Blank (the default) means MCP shares public_url's hostname —
  # the mcp/run s6 service falls back to that, and mcp-shared.conf (this
  # repo's own nginx include, not upstream's) proxies the rest of MCP's route
  # surface onto that same origin. Only set this to a second address for
  # installs with an access-control layer (Cloudflare Access or similar) in
  # front of public_url — MCP can't complete that kind of interactive login
  # redirect, so it needs its own hostname left out of that layer.
  mcp_origin: str?
