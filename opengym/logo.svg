<svg xmlns="http://www.w3.org/2000/svg" width="250" height="100" viewBox="0 0 250 100" role="img" aria-label="openGym">
  <!--
    Home Assistant Store logo derived from openGym's upstream assets/banner.svg.
    The mark, wordmark, colors, and geometry remain openGym's; only the compact
    250x100 layout required by the Store is packaging-specific.
  -->
  <rect width="250" height="100" rx="12" fill="#0c0e12"/>
  <rect x="1" y="1" width="248" height="98" rx="11" fill="none" stroke="#2b3140" stroke-width="2"/>
  <g transform="translate(49,50) scale(0.34)" fill="#a3e635">
    <rect x="-72" y="-10" width="144" height="20" rx="7"/>
    <rect x="-80" y="-36" width="20" height="72" rx="7"/>
    <rect x="-104" y="-25" width="17" height="50" rx="7"/>
    <rect x="60" y="-36" width="20" height="72" rx="7"/>
    <rect x="87" y="-25" width="17" height="50" rx="7"/>
  </g>
  <text x="91" y="61" fill="#eef1f6" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="-1.5">open</text>
  <text x="166" y="61" fill="#a3e635" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="-1.5">Gym</text>
</svg>
